model_list:
  # ── Text / Chat tiers via OpenRouter ──────────────────────────────────────
  # All models confirmed to support tool calling (required for agentic use).
  # Pricing: fractions of a cent per conversation.
  - model_name: cheap
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b-2507
      api_key: "os.environ/TIM_OPENROUTER_KEY"

  - model_name: cheap
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout
      api_key: "os.environ/TIM_OPENROUTER_KEY"

  - model_name: cheap
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: "os.environ/TIM_OPENROUTER_KEY"

  - model_name: complex
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: "os.environ/TIM_OPENROUTER_KEY"

  - model_name: reasoning
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b-thinking-2507
      api_key: "os.environ/TIM_OPENROUTER_KEY"

  # ── Audio tiers via OpenRouter ─────────────────────────────────────────────
  # Uses custom_llm_provider: openai so LiteLLM's OpenAI SDK client sends the
  # correct multipart/form-data (for Whisper) and binary streaming (for TTS)
  # directly to OpenRouter's OpenAI-compatible audio endpoints.
  - model_name: tts
    litellm_params:
      model: openai/gpt-4o-mini-tts-2025-12-15
      api_key: "os.environ/TIM_OPENROUTER_KEY"
      api_base: "https://openrouter.ai/api/v1"
      custom_llm_provider: "openai"

  - model_name: whisper
    litellm_params:
      model: openrouter/openai/whisper-1
      api_key: "os.environ/TIM_OPENROUTER_KEY"
      api_base: "https://openrouter.ai/api/v1"

  # ── Local models via vLLM (192.168.4.51:8001) ──────────────────────────
  - model_name: local-model
    litellm_params:
      model: openai/mtplx-qwen38-27b-optimized-quality
      api_base: "http://192.168.4.51:8001/v1"
      api_key: "os.environ/LOCAL_MODEL_API_KEY"
      enable_auto_tool_choice: true
      tool_call_parser: "hermes"
    model_info:
      base_model: "mtplx-qwen38-27b-optimized-quality"
      max_tokens: 4096
      context_window: 262144

  # - model_name: hermes-local
  #   litellm_params:
  #     model: openai/hermes3-llama31-8b-awq-local
  #     api_base: "http://192.168.4.124:8001/v1"
  #     api_key: "os.environ/LOCAL_MODEL_API_KEY"
  #     include_reasoning: false
  #     max_tokens: 4096
  #     context_window: 32768

litellm_settings:
  drop_params: True
  telemetry: False

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 1
  cooldown_time: 30
  enable_pre_call_checks: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
