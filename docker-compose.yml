services:
  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm_shared
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm_shared -U llmproxy"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm-shared:
    build: .
    container_name: litellm_shared
    ports:
      - "4100:4000"
    volumes:
      - ./config_shared.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      db:
        condition: service_healthy

  litellm-tim:
    build: .
    container_name: litellm_tim
    ports:
      - "4001:4000"
    volumes:
      - ./config_tim.yaml:/app/config.yaml
    env_file:
      - .tim.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      db:
        condition: service_healthy

  litellm-chrisann:
    build: .
    container_name: litellm_chrisann
    ports:
      - "4002:4000"
    volumes:
      - ./config_chrisann.yaml:/app/config.yaml
    env_file:
      - .chrisann.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      db:
        condition: service_healthy

  # ── Merged instance — replaces litellm-shared + litellm-tim + litellm-chrisann ──
  # Network aliases allow existing clients to connect by their old hostnames.
  # Port mappings preserve all existing host-side connections (IDE MCP, etc.).
  # Virtual keys (created via admin API after startup) enforce per-user model access.
  litellm:
    build: .
    container_name: litellm
    ports:
      - "4001:4000"   # was litellm-tim
      - "4002:4000"   # was litellm-chrisann
      - "4100:4000"   # was litellm-shared
    volumes:
      - ./config_all.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      litellm_default:
        aliases:
          - litellm-tim
          - litellm-chrisann
          - litellm-shared

volumes:
  postgres_data:

networks:
  litellm_default:
    external: true
