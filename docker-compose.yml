services:
  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm_shared
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port — access via: docker exec litellm_db psql -U llmproxy -d litellm_shared
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm_shared -U llmproxy"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Merged instance — replaces litellm-shared + litellm-tim + litellm-chrisann ──
  # Network aliases allow existing clients to connect by their old hostnames.
  # Port mappings preserve all existing host-side connections (IDE MCP, etc.).
  # Virtual keys (created via admin API after startup) enforce per-user model access.
  litellm:
    build: .
    container_name: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"   # was litellm-tim (localhost only)
      - "127.0.0.1:4002:4000"   # was litellm-chrisann (localhost only)
      - "127.0.0.1:4100:4000"   # was litellm-shared (localhost only)
    volumes:
      - ./config_all.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      litellm_default:
        aliases:
          - litellm-tim
          - litellm-chrisann
          - litellm-shared
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1500M

volumes:
  postgres_data:

networks:
  litellm_default:
    external: true
